name: Deploy prebuilt portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-prebuilt.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download the prebuilt portfolio
        run: |
          curl --fail --location \
            "https://github.com/${{ github.repository }}/releases/download/v1.0.0/liliandesign-pages.zip" \
            --output site.zip
          mkdir site
          unzip -q site.zip -d site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
